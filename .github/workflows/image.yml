name: Publish image
on:
  workflow_dispatch:
    inputs:
      change_reference:
        description: Change identifier for this image publication
        type: string
        required: true
permissions:
  contents: read
jobs:
  image:
    if: github.ref == 'refs/heads/main'
    environment: image-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup:verifier
      - name: Validate publication reference
        run: node --import tsx -e 'import("./tools/evidence.ts").then(m => m.changeReferenceSchema.parse(process.env.LAB_CHANGE_REFERENCE))'
        env:
          LAB_CHANGE_REFERENCE: ${{ inputs.change_reference }}
      - name: Verify publication protection
        run: node --import tsx -e 'import("./tools/workflow-guard.ts").then(m => m.requireProtectedEnvironment(process.env))'
        env:
          GH_TOKEN: ${{ github.token }}
          LAB_GITHUB_ENVIRONMENT: image-publication
      - run: npm run typecheck && npm test
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Name this build
        run: echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY,,}:build-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_REF }}
          build-args: |
            SOURCE_SHA=${{ github.sha }}
            BUILD_RUN_ID=${{ github.run_id }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Test the exact image to publish
        run: npm run test:container
        env:
          CONTAINER_TEST_IMAGE: ${{ env.IMAGE_REF }}
          CONTAINER_EXPECTED_SOURCE_SHA: ${{ github.sha }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the tested image and capture its registry digest
        run: |
          docker push "$IMAGE_REF"
          docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest}}' > registry-manifest.json
          node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync("registry-manifest.json","utf8")); if(!/^sha256:[a-f0-9]{64}$/.test(m.digest)) throw Error("Missing registry digest"); fs.writeFileSync("build-record.json",JSON.stringify({schemaVersion:2,image:process.env.IMAGE_REF.split(":")[0]+"@"+m.digest,sourceSha:process.env.GITHUB_SHA,buildRunId:process.env.GITHUB_RUN_ID,buildRunAttempt:process.env.GITHUB_RUN_ATTEMPT,platform:"linux/amd64",provenance:"github-attestation",changeReference:process.env.LAB_CHANGE_REFERENCE},null,2)); fs.appendFileSync(process.env.GITHUB_ENV,"IMAGE_DIGEST="+m.digest+"\n");'
        env:
          LAB_CHANGE_REFERENCE: ${{ inputs.change_reference }}
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
      - name: Verify emitted image provenance
        run: |
          cp "$ATTESTATION_BUNDLE" image.bundle.jsonl
          node --import tsx -e 'import("./tools/attestation.ts").then(async m => { const fs=await import("node:fs/promises"); const b=JSON.parse(await fs.readFile("build-record.json","utf8")); await m.verifyArtifact({subject:"oci://"+b.image,bundle:"image.bundle.jsonl",workflow:"image.yml",sourceSha:b.sourceSha}); })'
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-record.json
            image.bundle.jsonl
          if-no-files-found: error
          retention-days: 90
