name: Operate lab
run-name: ${{ inputs.target }} / ${{ inputs.operation }}
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [doctor, deploy, observe, rollback, reconcile]
        required: true
      target:
        type: choice
        options: [staging, live]
        required: true
      apply:
        description: Execute deployment or rollback after reviewing the subject
        type: boolean
        default: false
      image:
        description: Digest-qualified GHCR image (deploy)
        type: string
      source_sha:
        description: Source SHA from the image build record (deploy)
        type: string
      deployment:
        description: Earlier Railway deployment UUID (rollback)
        type: string
      restore_attempt:
        description: Earlier verified attempt UUID in the retained state (rollback)
        type: string
      attempt:
        description: Original uncertain attempt UUID (reconcile)
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: lab-operation-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  operate:
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - id: prepare
        name: Verify protection and locate previous operator state
        run: node --import tsx tools/workflow.ts prepare
        env:
          GH_TOKEN: ${{ github.token }}
          LAB_GITHUB_ENVIRONMENT: ${{ inputs.target }}
          LAB_TARGET: ${{ inputs.target }}
      - id: restore
        if: steps.prepare.outputs.previous_run != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.prepare.outputs.previous_artifact }}
          run-id: ${{ steps.prepare.outputs.previous_run }}
          github-token: ${{ github.token }}
          path: work
      - id: operation
        name: Execute the requested bounded operation
        run: node --import tsx tools/workflow.ts run
        env:
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          LAB_CONFIG_JSON: ${{ vars.LAB_CONFIG_JSON }}
          LAB_OPERATION: ${{ inputs.operation }}
          LAB_TARGET: ${{ inputs.target }}
          LAB_APPLY: ${{ inputs.apply }}
          LAB_IMAGE: ${{ inputs.image }}
          LAB_SOURCE_SHA: ${{ inputs.source_sha }}
          LAB_DEPLOYMENT: ${{ inputs.deployment }}
          LAB_RESTORE_ATTEMPT: ${{ inputs.restore_attempt }}
          LAB_ATTEMPT: ${{ inputs.attempt }}
      - name: Preserve evidence and unresolved operation locks
        if: always() && steps.operation.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab-state-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/
          if-no-files-found: error
          retention-days: 90
