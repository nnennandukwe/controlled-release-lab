name: Operate lab
run-name: ${{ inputs.target }} / ${{ inputs.operation }}
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [doctor, deploy, observe, rollback, reconcile, rehearse-recovery, expose, disable, observe-exposure, reconcile-exposure]
        required: true
      stage:
        description: Protected exposure stage (expose only)
        type: choice
        options: [internal, '5']
        default: internal
      rehearse_response_loss:
        description: Staging internal exposure only; discard one flag response and verify read-only recovery
        type: boolean
        default: false
      exposure_run:
        description: Exact successful internal exposure run (5 percent expansion)
        type: string
      exposure_attempt:
        type: string
        default: '1'
      target:
        type: choice
        options: [staging, live]
        required: true
      apply:
        description: Apply the resolved deployment, recovery rehearsal, exposure or disable
        type: boolean
        default: false
      change_reference:
        description: Change identifier (required for publication, observation or mutation)
        type: string
      build_run:
        description: Exact successful Publish image run ID (deploy/observe/rehearse-recovery)
        type: string
      build_attempt:
        type: string
        default: '1'
      image:
        description: Optional expected digest-qualified image; must match the build
        type: string
      source_sha:
        description: Optional expected source SHA; must match the build
        type: string
      evidence_run:
        description: Exact signed deployment baseline run (rollback or exposure)
        type: string
      evidence_attempt:
        type: string
        default: '1'
      deployment:
        description: Optional expected earlier deployment UUID (rollback)
        type: string
      restore_attempt:
        description: Optional expected earlier operation UUID (rollback)
        type: string
      attempt:
        description: Original uncertain operation UUID (reconcile)
        type: string
      max_duration_seconds:
        description: Deployment observation deadline; exposure has fixed policy bounds
        type: number
        default: 90
permissions:
  contents: read
  actions: read
concurrency:
  group: controlled-release-provider-writer
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  LAB_OPERATION: ${{ inputs.operation }}
  LAB_STAGE: ${{ inputs.stage }}
  LAB_REHEARSE_RESPONSE_LOSS: ${{ inputs.rehearse_response_loss }}
  LAB_EXPOSURE_RUN: ${{ inputs.exposure_run }}
  LAB_EXPOSURE_ATTEMPT: ${{ inputs.exposure_attempt }}
  LAB_TARGET: ${{ inputs.target }}
  LAB_APPLY: ${{ inputs.apply }}
  LAB_CHANGE_REFERENCE: ${{ inputs.change_reference }}
  LAB_BUILD_RUN: ${{ inputs.build_run }}
  LAB_BUILD_ATTEMPT: ${{ inputs.build_attempt }}
  LAB_IMAGE: ${{ inputs.image }}
  LAB_SOURCE_SHA: ${{ inputs.source_sha }}
  LAB_EVIDENCE_RUN: ${{ inputs.evidence_run }}
  LAB_EVIDENCE_ATTEMPT: ${{ inputs.evidence_attempt }}
  LAB_DEPLOYMENT: ${{ inputs.deployment }}
  LAB_RESTORE_ATTEMPT: ${{ inputs.restore_attempt }}
  LAB_ATTEMPT: ${{ inputs.attempt }}
  LAB_MAX_DURATION_SECONDS: ${{ inputs.max_duration_seconds }}
jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      has_request: ${{ steps.request.outputs.has_request }}
      needs_staging: ${{ steps.request.outputs.needs_staging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup:verifier
      - id: request
        run: node --import tsx tools/release-workflow.ts resolve
        env:
          LD_READ_TOKEN: ${{ secrets.LD_READ_TOKEN }}
      - if: steps.request.outputs.has_request == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-base/
          if-no-files-found: error
          retention-days: 90
  staging-proof:
    needs: resolve
    if: needs.resolve.outputs.needs_staging == 'true'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      attestations: write
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup:verifier
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-base
      - name: Observe current staging subject
        run: node --import tsx tools/release-workflow.ts proof
        env:
          LD_READ_TOKEN: ${{ secrets.LD_READ_TOKEN }}
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/staging-proof/deployment-evidence.json
      - run: cp "$BUNDLE" artifacts/staging-proof/evidence.bundle.jsonl
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/staging-proof/
          if-no-files-found: error
          retention-days: 90
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/staging-proof/
          if-no-files-found: ignore
          retention-days: 90
  finalize:
    needs: [resolve, staging-proof]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.has_request == 'true' && (needs.staging-proof.result == 'success' || needs.staging-proof.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup:verifier
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-base
      - if: needs.resolve.outputs.needs_staging == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/staging-proof
      - run: node --import tsx tools/release-workflow.ts finalize
        env:
          LAB_NEEDS_STAGING: ${{ needs.resolve.outputs.needs_staging }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-final/
          if-no-files-found: error
          retention-days: 90
  operate:
    needs: [resolve, finalize]
    if: always() && needs.resolve.result == 'success' && ((needs.resolve.outputs.has_request == 'true' && needs.finalize.result == 'success') || (needs.resolve.outputs.has_request == 'false' && needs.finalize.result == 'skipped'))
    environment: ${{ inputs.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      signed: ${{ steps.seal.outputs.sign }}
    permissions:
      contents: read
      actions: read
      attestations: write
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup:verifier
      - id: prepare
        name: Verify protection and locate previous operator state
        run: node --import tsx tools/workflow.ts prepare
        env:
          LAB_GITHUB_ENVIRONMENT: ${{ inputs.target }}
      - id: restore
        if: steps.prepare.outputs.previous_run != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.prepare.outputs.previous_artifact }}
          run-id: ${{ steps.prepare.outputs.previous_run }}
          github-token: ${{ github.token }}
          path: work
      - if: needs.resolve.outputs.has_request == 'true'
        name: Clear only the derived current request
        run: node --input-type=module -e 'import fs from "node:fs/promises"; await fs.rm("work/release/current",{recursive:true,force:true});'
      - if: needs.resolve.outputs.has_request == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/release/current
      - id: operation
        name: Execute the requested bounded operation
        run: node --import tsx tools/workflow.ts run
        env:
          LD_READ_TOKEN: ${{ secrets.LD_READ_TOKEN }}
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          LD_MANAGEMENT_TOKEN: ${{ (inputs.operation == 'expose' || inputs.operation == 'disable') && inputs.apply && secrets.LD_MANAGEMENT_TOKEN || '' }}
          LAB_CONFIG_JSON: ${{ vars.LAB_CONFIG_JSON }}
          LAB_RELEASE_DIR: ${{ needs.resolve.outputs.has_request == 'true' && 'work/release/current' || '' }}
      - name: Preserve evidence and unresolved operation locks
        if: always() && steps.operation.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab-state-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/
          if-no-files-found: error
          retention-days: 90
      - id: seal
        if: steps.operation.outcome == 'success' && inputs.operation != 'doctor'
        run: node --import tsx tools/release-workflow.ts seal
      - id: attest
        if: steps.seal.outputs.sign == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.seal.outputs.subject_path }}
      - if: steps.seal.outputs.sign == 'true'
        run: cp "$BUNDLE" artifacts/observation/evidence.bundle.jsonl
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      - if: steps.seal.outputs.sign == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab-proof-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/observation/
          if-no-files-found: error
          retention-days: 90
  queue-flag-recovery:
    needs: operate
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && needs.operate.result == 'success' && needs.operate.outputs.signed == 'true' && inputs.operation == 'rehearse-recovery' && inputs.target == 'staging' && inputs.apply
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # Explicit dispatch works for workflow-token producers. No provider secrets,
      # producer checkout, or artifact execution are present in this job.
      - name: Queue real staging flag recovery from the signed off baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANGE_REFERENCE: ${{ inputs.change_reference }}
          EVIDENCE_RUN: ${{ github.run_id }}
          EVIDENCE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # Parent resolution validated this reference before its protected approval.
          test -n "$CHANGE_REFERENCE"
          gh workflow run operate.yml --ref main \
            -f operation=expose -f target=staging -f stage=internal -f apply=true \
            -f rehearse_response_loss=true \
            -f evidence_run="$EVIDENCE_RUN" -f evidence_attempt="$EVIDENCE_ATTEMPT" \
            -f change_reference="$CHANGE_REFERENCE"
          echo 'Flag recovery rehearsal queued in Operate lab (staging / expose). Its immutable request binds the audit reference and requires separate staging approval. Only the signed cohort result proves recovery; queueing is not authorization or acceptance.' >> "$GITHUB_STEP_SUMMARY"
